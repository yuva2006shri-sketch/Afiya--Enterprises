<html lang="en">

  <style>
    :root {
      --primary: #0077b6;
      --primary-hover: #023e8a;
      --whatsapp: #25d366;
      --whatsapp-hover: #1ebc57;
      --call-btn: #16a34a;
      --call-btn-hover: #15803d;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --bg-light: #f0f7ff;
      --card-bg: #ffffff;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      color: var(--text-dark);
      background-color: #ffffff;
      line-height: 1.5;
    }

    /* Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 5%;
      border-bottom: 1px solid #e2e8f0;
      background: #ffffff;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--primary);
    }

    /* Hero Section */
    .hero {
      background-color: var(--bg-light);
      padding: 3.5rem 5%;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      align-items: center;
      gap: 2.5rem;
    }

    .hero h1 {
      font-size: 2.4rem;
      font-weight: 800;
      color: #0f4c81;
      margin-bottom: 1rem;
      line-height: 1.25;
    }

    .hero p {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .hero .tagline {
      font-weight: 600;
      color: #334155;
      margin-bottom: 2rem;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.75rem 1.6rem;
      border-radius: 9999px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-whatsapp {
      background-color: var(--whatsapp);
      color: #ffffff;
    }
